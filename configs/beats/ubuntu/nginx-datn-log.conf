# /etc/nginx/conf.d/datn-log.conf — access log JSON theo tên trường ECS cho R02, R03, R07, R08.
# conf.d nằm trong khối http{} của nginx.conf Ubuntu. Log cũ access.log vẫn giữ nguyên.
# Nếu server{} của Flaskr có access_log riêng thì phải thêm dòng access_log bên dưới vào server{} đó.

log_format datn_json escape=json
  '{'
    '"event_time":"$time_iso8601",'
    '"source.ip":"$remote_addr",'
    '"http.request.method":"$request_method",'
    '"url.original":"$request_uri",'
    '"url.domain":"$host",'
    '"http.response.status_code":$status,'
    '"http.response.body.bytes":$body_bytes_sent,'
    '"http.request.referrer":"$http_referer",'
    '"http.request.id":"$request_id",'
    '"user_agent.original":"$http_user_agent",'
    '"event.kind":"event",'
    '"event.category":"web",'
    '"event.dataset":"nginx.access"'
  '}';

access_log /var/log/nginx/access.json datn_json;
