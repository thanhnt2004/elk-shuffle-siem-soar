# C:\Program Files\Winlogbeat\winlogbeat.yml — Windows 10 (192.168.100.101)
# Winlogbeat 9.5.4 -> Logstash 10.99.0.1:5044 (TLS) qua pfSense + WireGuard.

winlogbeat.event_logs:
  - name: Microsoft-Windows-Sysmon/Operational      # 1, 3, 10, 11, 12-14, 22 (lọc trong sysmon-datn.xml)
    ignore_older: 24h
  - name: Security
    event_id: 1102, 4624, 4625, 4697, 4698, 4719, 4720, 4728, 4732, 4756
    ignore_older: 24h
  - name: System
    event_id: 104, 7045
    ignore_older: 24h
  - name: Microsoft-Windows-Windows Defender/Operational
    event_id: 1116, 1117, 5001
    ignore_older: 24h
  - name: Microsoft-Windows-PowerShell/Operational
    event_id: 4104
    ignore_older: 24h
  - name: Application
    provider: [DATN-SOAR]                            # nhật ký của C:\SOAR\responder.ps1
    ignore_older: 24h

# Khóa định tuyến Logstash -> datn-windows-*
fields: { log_source: windows }

processors:
  # Logstash gọi ingest pipeline theo @metadata.pipeline. Ghi rõ để không phụ thuộc mặc định.
  - add_fields:
      target: "@metadata"
      fields: { pipeline: "winlogbeat-9.5.4-routing" }

queue.mem:
  events: 4096

output.logstash:
  hosts: ["10.99.0.1:5044"]
  ssl.enabled: true
  ssl.certificate_authorities: ['C:\DATN\ca.crt']
  ssl.verification_mode: full
  timeout: 30s

logging.level: info
logging.to_files: true
logging.files:
  path: C:\ProgramData\winlogbeat\Logs
  keepfiles: 5
