name: elk

services:
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    profiles: ["setup"]
    user: "0"
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs
      - ./instances.yml:/usr/share/elasticsearch/config/instances.yml:ro
    command:
      - bash
      - -c
      - |
        set -e
        cd /usr/share/elasticsearch
        if [ ! -f config/certs/ca/ca.crt ]; then
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip
          unzip -oq config/certs/ca.zip -d config/certs
        fi
        if [ ! -f config/certs/elasticsearch/elasticsearch.crt ]; then
          bin/elasticsearch-certutil cert --silent --pem --in config/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key -out config/certs/certs.zip
          unzip -oq config/certs/certs.zip -d config/certs
        fi
        rm -f config/certs/*.zip
        chown -R 1000:0 config/certs
        find config/certs -type d -exec chmod 750 {} \;
        find config/certs -type f -exec chmod 640 {} \;
        chown 0:0 config/certs/ca/ca.key
        chmod 600 config/certs/ca/ca.key
        echo "es-setup: xong"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: elasticsearch
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es01
      - cluster.name=datn
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1536m -Xmx1536m
      - TZ=Asia/Ho_Chi_Minh
      - xpack.license.self_generated.type=basic
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.ml.enabled=false
      - ingest.geoip.downloader.enabled=false
      - action.destructive_requires_name=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65535, hard: 65535 }
    mem_limit: 2560m
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs:ro
      - esdata:/usr/share/elasticsearch/data
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro   # image không có tzdata; JVM tự hiểu TZ, mount để lệnh date cũng đúng
    ports:
      - "127.0.0.1:9200:9200"
      - "10.99.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 15s
      timeout: 10s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    restart: unless-stopped
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      - SERVERNAME=kibana
      - TZ=Asia/Ho_Chi_Minh
      - SERVER_PUBLICBASEURL=${KIBANA_PUBLIC_URL:-http://127.0.0.1:5601}
      - XPACK_SECURITY_SESSION_IDLETIMEOUT=8h
      - XPACK_SECURITY_SESSION_LIFESPAN=7d
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_KEY_SAVED_OBJECTS}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_KEY_SECURITY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_KEY_REPORTING}
      - NODE_OPTIONS=--max-old-space-size=900
    mem_limit: 1400m
    volumes:
      - ./certs:/usr/share/kibana/config/certs:ro
      - kibanadata:/usr/share/kibana/data
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    ports:
      - "${KIBANA_BIND_IP:-127.0.0.1}:5601:5601"

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
    container_name: logstash
    restart: unless-stopped
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      - LS_JAVA_OPTS=-Xms448m -Xmx448m
      - TZ=Asia/Ho_Chi_Minh
      - PIPELINE_WORKERS=1
      - XPACK_MONITORING_ENABLED=false
      - LOGSTASH_WRITER_PASSWORD=${LOGSTASH_WRITER_PASSWORD}
    mem_limit: 1g
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./certs:/usr/share/logstash/config/certs:ro
    ports:
      - "10.99.0.1:5044:5044"
      - "10.99.0.1:5514:5514/udp"

volumes:
  esdata:
  kibanadata:

networks:
  default:
    name: elk
