# DATN v2 — pipeline Logstash duy nhất.
# Beats (Filebeat/Winlogbeat) vào 5044 TLS; pfSense syslog RFC 5424 vào 5514/udp.
# Sửa 2 khối "dictionary" cho đúng tên interface pfSense (Interfaces → Assignments).

input {
  beats {
    id => "in_beats"
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
    ssl_client_authentication => "none"
  }
  udp {
    id => "in_pfsense"
    port => 5514
    add_field => { "[fields][log_source]" => "pfsense" }
  }
}

filter {
  ruby { code => 'event.set("[event][ingested]", LogStash::Timestamp.now)' }

  if [fields][log_source] == "pfsense" {
    # RFC 5424: <PRI>1 TIMESTAMP HOST APP PROCID MSGID SD MSG
    grok {
      id => "pf_header"
      match => { "message" => "^<%{NONNEGINT:[log][syslog][priority]:int}>1 %{TIMESTAMP_ISO8601:[@metadata][ts]} %{NOTSPACE:[observer][hostname]} %{NOTSPACE:[log][syslog][appname]} %{NOTSPACE:[log][syslog][procid]} %{NOTSPACE} %{NOTSPACE} %{GREEDYDATA:[@metadata][msg]}$" }
    }

    if "_grokparsefailure" in [tags] {
      mutate { add_field => { "[@metadata][index]" => "unknown" } }
    } else {
      # RFC 5424 có múi giờ sẵn; timezone chỉ dùng khi chuỗi thiếu múi giờ (coi là giờ Việt Nam)
      date { match => ["[@metadata][ts]", "ISO8601"] timezone => "Asia/Ho_Chi_Minh" }
      mutate { add_field => { "[observer][type]" => "firewall" "[observer][vendor]" => "Netgate" "[observer][product]" => "pfSense" } }

      if [log][syslog][appname] == "filterlog" {
        csv {
          source => "[@metadata][msg]"
          target => "[@metadata][pf]"
          skip_empty_columns => true
          columns => ["rule_number","sub_rule","anchor","tracker","interface","reason","action","direction",
                      "ip_version","tos","ecn","ttl","ip_id","offset","ip_flags","proto_id","proto","length",
                      "src_ip","dst_ip","src_port","dst_port","data_len"]
        }
        if [@metadata][pf][ip_version] != "4" { drop {} }   # lab chỉ dùng IPv4

        mutate {
          add_field => {
            "[@metadata][index]" => "pfsense-fw"
            "[event][kind]" => "event"
            "[event][category]" => "network"
            "[event][dataset]" => "pfsense.firewall"
            "[event][action]" => "%{[@metadata][pf][action]}"
            "[event][reason]" => "%{[@metadata][pf][reason]}"
            "[rule][id]" => "%{[@metadata][pf][tracker]}"
            "[network][transport]" => "%{[@metadata][pf][proto]}"
            "[network][iana_number]" => "%{[@metadata][pf][proto_id]}"
            "[source][ip]" => "%{[@metadata][pf][src_ip]}"
            "[destination][ip]" => "%{[@metadata][pf][dst_ip]}"
          }
        }

        if [@metadata][pf][direction] == "in" {
          mutate { add_field => { "[network][direction]" => "ingress" "[observer][ingress][interface][name]" => "%{[@metadata][pf][interface]}" } }
          translate {
            source => "[observer][ingress][interface][name]"
            target => "[observer][ingress][zone]"
            dictionary => { "vmx0" => "wan" "vmx1" => "lan" "em0" => "wan" "em1" => "lan" "tun_wg0" => "wireguard" }
            fallback => "other"
          }
        } else {
          mutate { add_field => { "[network][direction]" => "egress" "[observer][egress][interface][name]" => "%{[@metadata][pf][interface]}" } }
          translate {
            source => "[observer][egress][interface][name]"
            target => "[observer][egress][zone]"
            dictionary => { "vmx0" => "wan" "vmx1" => "lan" "em0" => "wan" "em1" => "lan" "tun_wg0" => "wireguard" }
            fallback => "other"
          }
        }

        if [@metadata][pf][proto] in ["tcp", "udp"] {
          mutate { add_field => { "[source][port]" => "%{[@metadata][pf][src_port]}" "[destination][port]" => "%{[@metadata][pf][dst_port]}" } }
          mutate { convert => { "[source][port]" => "integer" "[destination][port]" => "integer" } }
        }

      } else if [log][syslog][appname] == "unbound" {
        # Unbound log-queries: "[pid:0] info: 192.168.100.101 abc.attacker.test. A IN"
        grok {
          id => "pf_unbound"
          match => { "[@metadata][msg]" => "info: %{IP:[source][ip]} %{NOTSPACE:[dns][question][name]} %{NOTSPACE:[dns][question][type]} %{NOTSPACE:[dns][question][class]}$" }
          tag_on_failure => ["_unbound_not_query"]
        }
        if "_unbound_not_query" in [tags] { drop {} }

        mutate {
          gsub => ["[dns][question][name]", "\.$", ""]
          lowercase => ["[dns][question][name]"]
          add_field => {
            "[@metadata][index]" => "pfsense-dns"
            "[event][kind]" => "event"
            "[event][category]" => "network"
            "[event][dataset]" => "pfsense.dns"
            "[dns][type]" => "query"
          }
        }
        # registered_domain = 2 nhãn cuối (đủ cho attacker.test; không xử lý hậu tố kiểu co.uk)
        ruby {
          code => '
            name = event.get("[dns][question][name]")
            if name
              parts = name.split(".")
              if parts.length >= 2
                event.set("[dns][question][registered_domain]", parts.last(2).join("."))
                event.set("[dns][question][subdomain]", parts[0...-2].join(".")) if parts.length > 2
              end
            end
          '
        }

      } else {
        drop {}   # log pfSense khác không thuộc phạm vi
      }
    }

  } else if [fields][log_source] in ["ubuntu-system", "ubuntu-audit", "windows"] {
    mutate { add_field => { "[@metadata][index]" => "%{[fields][log_source]}" } }
  } else if [fields][log_source] in ["web-nginx", "web-auth"] {
    mutate { add_field => { "[@metadata][index]" => "web" } }
  } else {
    mutate { add_field => { "[@metadata][index]" => "unknown" } }
  }

  # Pipeline Filebeat auth đổi tên nội dung đã phân tích thành message.
  # Giữ nguyên bản gốc và tránh xung đột nếu Beats đã gửi message.
  if [fields][log_source] == "ubuntu-system" and [event][dataset] == "system.auth" and [input][type] == "log" and [@metadata][pipeline] =~ /^filebeat-.*-system-auth-entrypoint$/ and [event][original] and [message] {
    mutate {
      add_tag => ["preserve_original_event"]
      remove_field => ["message"]
    }
  }

  # Ngày trong tên index theo giờ Việt Nam (UTC+7, không có giờ mùa hè).
  # %{+YYYY.MM.dd} của Logstash luôn tính theo UTC: log 00:00–06:59 giờ VN sẽ rơi vào index hôm trước.
  # @timestamp vẫn lưu UTC (chuẩn của Elasticsearch); Kibana hiển thị theo dateFormat:tz = Asia/Ho_Chi_Minh.
  ruby {
    id => "index_day_vn"
    code => '
      t = event.get("@timestamp")
      day = t ? Time.at(t.to_f).getlocal("+07:00") : Time.now.getlocal("+07:00")
      event.set("[@metadata][index_day]", day.strftime("%Y.%m.%d"))
    '
  }
}

output {
  # Event của module Filebeat (system, auditd) và Winlogbeat cần ingest pipeline của Beats
  if [@metadata][pipeline] {
    elasticsearch {
      id => "out_es_pipeline"
      hosts => ["https://elasticsearch:9200"]
      user => "logstash_writer"
      password => "${LOGSTASH_WRITER_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
      index => "datn-%{[@metadata][index]}-%{[@metadata][index_day]}"
      pipeline => "%{[@metadata][pipeline]}"
      action => "create"
      manage_template => false
      ilm_enabled => false
      data_stream => "false"
    }
  } else {
    elasticsearch {
      id => "out_es"
      hosts => ["https://elasticsearch:9200"]
      user => "logstash_writer"
      password => "${LOGSTASH_WRITER_PASSWORD}"
      ssl_enabled => true
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
      index => "datn-%{[@metadata][index]}-%{[@metadata][index_day]}"
      action => "create"
      manage_template => false
      ilm_enabled => false
      data_stream => "false"
    }
  }
}
